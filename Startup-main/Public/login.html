<!DOCTYPE html>
<html lang="en">
  <head>
  
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="TN-FUTECX - Future Tech Hub! Join us to explore the latest innovations in Tamil Nadu." />
  <meta name="keywords" content="TN-FUTECX, Future Tech, Innovation, Tamil Nadu, AI, Cloud" />
  <meta name="author" content="TN-FUTECX Team" />
  <meta name="robots" content="index, follow" />


  <title>TN-FUTECX - Future Tech Hub</title>

  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

<link rel="icon" href="/public/FUTECX.ico" type="image/x-icon">



    <link rel="stylesheet" href="index.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background-image: url('FUTECX.webp'); 
            background-size: cover; 
            background-repeat: no-repeat; 
            background-position: center; 
        }
        
        .remember-forgot a, .register-link p, .register-link a {
            color: rgb(231, 231, 255); 
            text-decoration: none; 
        }
        .remember-forgot a:hover, .register-link a:hover {
            text-decoration: underline;
        }
        .input-container {
            position: relative;
            width: 100%;
        }
        .input-container input {
            width: 100%;
            padding-right: 40px;
        }
        .input-container .eye-icon {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .button-container {
            margin-top: 20px;
        }
        .button {
            padding: 10px 20px;
            border: none;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        .button:hover {
            background-color: #0056b3;
      }




















      .social-btn {
        width: 45px;
        height: 45px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(6px);
        box-shadow: 0 0 10px rgba(0, 170, 255, 0.4);
        cursor: pointer;
        transition: all 0.3s ease;
      }
      
      .social-btn i {
        font-size: 22px;
        color: white;
      }
      
      .social-btn:hover {
        transform: scale(1.1);
        background: rgba(0, 170, 255, 0.25);
        box-shadow: 0 0 15px rgba(0, 170, 255, 0.7);
      }
      
    </style>
  </head>
  <body>
    <script type="module">
        import { 
          initializeApp 
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        
        import { 
          getAuth, 
          createUserWithEmailAndPassword, 
          signInWithEmailAndPassword, 
          sendPasswordResetEmail, 
          GoogleAuthProvider, 
          FacebookAuthProvider, 
          signInWithPopup 
        } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
      
        // 🔹 TN-FUTECX Firebase Config
        const firebaseConfig = {
          apiKey: "AIzaSyDMj45IV8LXuOArD2DgtwvfB841dzcn620",
          authDomain: "tn-futecx.firebaseapp.com",
          projectId: "tn-futecx",
          storageBucket: "tn-futecx.firebasestorage.app",
          messagingSenderId: "884450104101",
          appId: "1:884450104101:web:eae68a54cdee6078f300cc",
          measurementId: "G-TNYE4ZSD3C"
        };
      
        // 🔹 Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
      
        // 🔹 Email Login
        const loginForm = document.getElementById("login-form");
        loginForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const email = document.getElementById("username").value;
          const password = document.getElementById("password").value;
      
          signInWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
              const user = userCredential.user;
              localStorage.setItem("loggedInUser", user.email);
              alert("Login successful!");
              window.location.href = "index.html";
            })
            .catch((error) => {
              alert("Login failed: " + error.message);
            });
        });
      
        // 🔹 Register New User
        const registerForm = document.getElementById("register-form");
        registerForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const email = document.getElementById("email").value;
          const password = document.getElementById("reg-password").value;
      
          createUserWithEmailAndPassword(auth, email, password)
            .then(() => {
              alert("Registration successful!");
              window.location.href = "home.html";
            })
            .catch((error) => {
              alert("Registration failed: " + error.message);
            });
        });
      
        // 🔹 Forgot Password
        const forgotPasswordForm = document.getElementById("forgot-password-form");
        forgotPasswordForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const email = document.getElementById("reset-email").value;
      
          sendPasswordResetEmail(auth, email)
            .then(() => {
              alert("Password reset email sent!");
            })
            .catch((error) => {
              alert("Failed to send reset email: " + error.message);
            });
        });
      
        // 🔹 Google Login
        const googleBtn = document.querySelector(".fa-google").parentElement;
        googleBtn.addEventListener("click", async () => {
          const provider = new GoogleAuthProvider();
          try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            localStorage.setItem("loggedInUser", user.displayName);
            alert(`Welcome ${user.displayName}!`);
            window.location.href = "index.html";
          } catch (error) {
            alert("Google login failed: " + error.message);
          }
        });
      
        // 🔹 Facebook Login
        const facebookBtn = document.querySelector(".fa-facebook-f").parentElement;
        facebookBtn.addEventListener("click", async () => {
          const provider = new FacebookAuthProvider();
          try {
            const result = await signInWithPopup(auth, provider);
            const user = result.user;
            localStorage.setItem("loggedInUser", user.displayName);
            alert(`Welcome ${user.displayName}!`);
            window.location.href = "index.html";
          } catch (error) {
            alert("Facebook login failed: " + error.message);
          }
        });
      
        // 🔹 Switch Forms (Login ↔ Register ↔ Forgot)
        window.toggleForms = function(formId) {
          const forms = document.querySelectorAll(".form-section");
          forms.forEach((form) => form.classList.remove("active"));
          document.getElementById(formId).classList.add("active");
        };
      
        // 🔹 Password Eye Toggle
        window.togglePasswordVisibility = function() {
          const passwordInput = document.getElementById('password');
          const eyeIcon = document.getElementById('eye-icon');
          if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            eyeIcon.classList.remove('fa-eye');
            eyeIcon.classList.add('fa-eye-slash');
          } else {
            passwordInput.type = 'password';
            eyeIcon.classList.remove('fa-eye-slash');
            eyeIcon.classList.add('fa-eye');
          }
        };
      </script>
      
    <div class="wrapper">
        <main>
          <article data-glow>
            <div class="form-container">
  
              <!-- 🔹 Login Form -->
              <div id="login-form" class="form-section active">
                <h2>Login</h2>
                <form id="loginForm">
                  <div class="form-group">
                    <label for="username">Email</label>
                    <div class="input-container">
                      <input type="email" id="username" required>
                      <i class="fas fa-user icon"></i>
                    </div>
                  </div>
  
                  <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                      <input type="password" id="password" required>
                      <i class="fas fa-eye eye-icon" id="eye-icon" onclick="togglePasswordVisibility()"></i>
                    </div>
                  </div>
  
                  <div class="remember-forgot">
                    <label><input type="checkbox"> Remember me</label>
                    <a href="#" onclick="toggleForms('forgot-password-form')">Forgot password?</a>
                  </div>
  
                  <div class="button-container">
                    <button class="button" type="submit">Login</button>
                  </div>
  
                  <div class="social-login" style="margin-top:25px; text-align:center;">
                    <p style="color:white; font-size:14px;">or continue with</p>
                    <div class="social-icons" style="margin-top:10px; display:flex; justify-content:center; gap:15px;">
                      <div class="social-btn" title="Continue with Google"><i class="fab fa-google"></i></div>
                      <div class="social-btn" title="Continue with X"><i class="fab fa-x-twitter"></i></div>
                      <div class="social-btn" title="Continue with Facebook"><i class="fab fa-facebook-f"></i></div>
                    </div>
                  </div>
  
                  <div class="register-link" style="margin-top:20px;">
                    <p>Don't have an account? <a href="#" onclick="toggleForms('register-form')">Register</a></p>
                  </div>
                </form>
              </div>
  
              <!-- 🔹 Register Form -->
              <div id="register-form" class="form-section">
                <h2>Register</h2>
                <form id="registerForm">
                  <div class="form-group">
                    <label for="email">Email</label>
                    <div class="input-container">
                      <input type="email" id="email" required>
                      <i class="fas fa-envelope icon"></i>
                    </div>
                  </div>
  
                  <div class="form-group">
                    <label for="reg-password">Password</label>
                    <div class="input-container">
                      <input type="password" id="reg-password" required>
                      <i class="fas fa-eye eye-icon" id="reg-eye-icon" onclick="togglePasswordVisibilityRegister()"></i>
                    </div>
                  </div>
  
                  <div class="button-container">
                    <button class="button" type="submit">Register</button>
                  </div>
  
                  <div class="register-link">
                    <p>Already have an account? <a href="#" onclick="toggleForms('login-form')">Login</a></p>
                  </div>
                </form>
              </div>
  
              <!-- 🔹 Forgot Password -->
              <div id="forgot-password-form" class="form-section">
                <h2>Reset Password</h2>
                <form id="forgotPasswordForm">
                  <div class="form-group">
                    <label for="reset-email">Enter your email</label>
                    <div class="input-container">
                      <input type="email" id="reset-email" required>
                      <i class="fas fa-envelope icon"></i>
                    </div>
                  </div>
  
                  <div class="button-container">
                    <button class="button" type="submit">Send Reset Link</button>
                  </div>
  
                  <div class="register-link">
                    <p>Remembered your password? <a href="#" onclick="toggleForms('login-form')">Login</a></p>
                  </div>
                </form>
              </div>
  
            </div>
          </article>
        </main>
      </div>
  


<script>
    function toggleForms(formId) {
        document.querySelectorAll('.form-section').forEach(form => form.classList.remove('active'));
        document.getElementById(formId).classList.add('active');
    }

    // Toggle password visibility for the login form
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eye-icon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}

// Toggle password visibility for the registration form
function togglePasswordVisibilityRegister() {
    const passwordInput = document.getElementById('reg-password');
    const eyeIcon = document.getElementById('reg-eye-icon');
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
    } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
    }
}


    document.addEventListener('DOMContentLoaded', () => {
        const syncPointer = ({ x: pointerX, y: pointerY }) => {
            const x = pointerX.toFixed(2);
            const y = pointerY.toFixed(2);
            const xp = (pointerX / window.innerWidth).toFixed(2);
            const yp = (pointerY / window.innerHeight).toFixed(2);
            document.documentElement.style.setProperty('--x', x);
            document.documentElement.style.setProperty('--xp', xp);
            document.documentElement.style.setProperty('--y', y);
            document.documentElement.style.setProperty('--yp', yp);
        };

        document.body.addEventListener('pointermove', syncPointer);
    });





    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'GA_TRACKING_ID');

          e.preventDefault();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();
        
          if (email && password) {
            localStorage.setItem("loggedInUser", email);
            alert("✅ Login successful!");
            window.location.href = "index.html"; // redirect to home
          } else {
            alert("Please fill all fields.");
          }
        });
      
        
    </script>

    
  </body>
</html>
